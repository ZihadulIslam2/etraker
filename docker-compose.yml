services:
  postgres:
    image: postgres:16-alpine
    container_name: etraker-db
    environment:
      POSTGRES_USER: etraker
      POSTGRES_PASSWORD: etraker_dev
      POSTGRES_DB: etraker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etraker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
